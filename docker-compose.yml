# GreenMail IMAP test server for the integration tests in
# crates/imap/tests/greenmail.rs.
#
#   docker compose up -d
#   TEGAMI_GREENMAIL_HOST=localhost cargo test -p imap
#
# The same image and options are used by CI (see .github/workflows/ci.yml).
services:
  greenmail:
    image: greenmail/standalone:2.1.13
    ports:
      - "3143:3143"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=user:pass@localhost"