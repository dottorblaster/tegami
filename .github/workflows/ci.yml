name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  rust:
    name: clippy + test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install test dependencies
        run: |
          dnf install --assumeyes --quiet dbus-daemon cpio
          cd /
          dnf download --assumeyes libadwaita libadwaita-devel
          rpm2cpio libadwaita-devel-1*.rpm | cpio -id './usr/share/gir-1.0/*'
          rpm2cpio libadwaita-1*.rpm | cpio -id './usr/lib64/girepository-1.0/*'
          rm -f libadwaita*.rpm
          test -f usr/share/gir-1.0/Adw-1.gir
          test -f usr/lib64/girepository-1.0/Adw-1.typelib
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --workspace

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - name: Install introspection data
        run: |
          dnf install --assumeyes --quiet cpio
          cd /
          dnf download --assumeyes libadwaita libadwaita-devel
          rpm2cpio libadwaita-devel-1*.rpm | cpio -id './usr/share/gir-1.0/*'
          rpm2cpio libadwaita-1*.rpm | cpio -id './usr/lib64/girepository-1.0/*'
          rm -f libadwaita*.rpm
          test -f usr/share/gir-1.0/Adw-1.gir
          test -f usr/lib64/girepository-1.0/Adw-1.typelib
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-
      - run: cargo +1.93 check --workspace --all-targets

  meson:
    name: meson
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install introspection data
        run: |
          dnf install --assumeyes --quiet cpio
          cd /
          dnf download --assumeyes libadwaita libadwaita-devel
          rpm2cpio libadwaita-devel-1*.rpm | cpio -id './usr/share/gir-1.0/*'
          rpm2cpio libadwaita-1*.rpm | cpio -id './usr/lib64/girepository-1.0/*'
          rm -f libadwaita*.rpm
          test -f usr/share/gir-1.0/Adw-1.gir
          test -f usr/lib64/girepository-1.0/Adw-1.typelib
      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-meson-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-meson-${{ runner.os }}-
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build

  flatpak:
    name: flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tegami.flatpak
          manifest-path: build-aux/flatpak/it.dottorblaster.tegami.json