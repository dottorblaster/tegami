name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  rust:
    name: clippy + test
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          zypper --gpg-auto-import-keys --non-interactive install \
            gcc pkgconf-pkg-config glib2-devel glib2-tools gtk4-devel libadwaita-devel \
            blueprint-compiler dbus-1-daemon git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup component add clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-rust-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --workspace

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          zypper --gpg-auto-import-keys --non-interactive install \
            gcc pkgconf-pkg-config glib2-devel glib2-tools gtk4-devel libadwaita-devel \
            blueprint-compiler git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.93 --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-
      - run: cargo +1.93 check --workspace --all-targets

  meson:
    name: meson
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          zypper --gpg-auto-import-keys --non-interactive install \
            gcc pkgconf-pkg-config glib2-devel glib2-tools gtk4-devel libadwaita-devel \
            blueprint-compiler meson ninja dbus-1-daemon git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-meson-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-meson-${{ runner.os }}-
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build

  flatpak:
    name: flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tegami.flatpak
          manifest-path: build-aux/flatpak/it.dottorblaster.tegami.json